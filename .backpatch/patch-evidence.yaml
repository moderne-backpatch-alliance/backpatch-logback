    note: "New in this release; ported onto 1.2.13; fixed at 1.2.13.1-backpatch-00003 (backpatch-logback@624061b). Effect: an <if condition> in a configuration file no longer applies either branch and logs two warnings, as upstream 1.5.37, which removed Janino based conditional processing and skips the block with warnings. No error status is logged, so applications that stop on logback configuration errors (Spring Boot does) still start. Janino stays on the classpath for the Janino event evaluators."
